x-hosting:
  expose: master
  port: 8080

services:
  master:
    image: jameelh99/fafnirx:latest
    ports:
      - "8080:8080" # web app, web API and device API (gRPC)
    environment:
      FAFNIRX_DATABASE_URL: postgresql://fafnirx:${{db.POSTGRES_PASSWORD}}@${{db.HOST}}:${{db.PORT}}/fafnirx
      FAFNIRX_ADMIN_PASSWORD: # secret, read at the first start only
      FAFNIRX_PLUGIN_SECRET: # secret, 16+ characters (`openssl rand -hex 24`), shared with the add-ons
      FAFNIRX_PLUGINS: video # warn administrators when the video add-on is missing
      FAFNIRX_DATA: /data
      HOME: /tmp # rclone wants a writable home for its cache
    volumes:
      - masterdata:/data
    depends_on:
      - db
  video:
    image: jameelh99/fafnirx-video:latest
    expose:
      - "8090"
    environment:
      FAFNIRX_PLUGIN_SECRET: ${{master.FAFNIRX_PLUGIN_SECRET}}
      FAFNIRX_MASTER_URL: http://${{master.HOST}}:8080
      FAFNIRX_PLUGIN_URL: http://${{video.HOST}}:8090
      FAFNIRX_VIDEO_CACHE: /cache
      FAFNIRX_VIDEO_KEEP_DAYS: "7"
      FAFNIRX_VIDEO_JOBS: "2"
      FAFNIRX_VIDEO_VCODEC: libx264
    volumes:
      - masterdata:/data:ro # reads the videos in /data/files, never changes them
      - videocache:/cache # HLS segments, removed after 7 days unwatched
    depends_on:
      - master
  db:
    image: postgres:17
    expose:
      - "5432"
    environment:
      POSTGRES_DB: fafnirx
      POSTGRES_USER: fafnirx
      POSTGRES_PASSWORD: # secret
      PGDATA: /data/pgdata
    volumes:
      - pgdata:/data

volumes:
  masterdata:
  videocache:
  pgdata:

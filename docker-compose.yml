x-hosting:
  expose: master
  port: 8080

services:
  master:
    image: jameelh99/fafnirx:latest
    ports:
      - "8080:8080" # web app, web API and device API (gRPC)
    environment:
      FAFNIRX_DATABASE_URL: postgresql://fafnirx:${{db.POSTGRES_PASSWORD}}@${{db.HOST}}:${{db.PORT}}/fafnirx
      FAFNIRX_ADMIN_PASSWORD: # secret, read at the first start only
      FAFNIRX_DATA: /data
      HOME: /tmp # rclone wants a writable home for its cache
    volumes:
      - masterdata:/data
    depends_on:
      - db
  video:
    image: jameelh99/fafnirx-video:latest
    environment:
      FAFNIRX_MASTER_URL: http://master:8080
      FAFNIRX_DATA: /data
      HOME: /tmp
    volumes:
      - videodata:/data
    depends_on:
      - master
  db:
    image: postgres:17
    expose:
      - "5432"
    environment:
      POSTGRES_DB: fafnirx
      POSTGRES_USER: fafnirx
      POSTGRES_PASSWORD: # secret
      PGDATA: /data/pgdata
    volumes:
      - pgdata:/data

volumes:
  masterdata:
  videodata:
  pgdata:

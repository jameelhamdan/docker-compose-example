# fafnirx on ghuyum.cloud: the master and its database. All persistent data is under /data in each container
# (the master's files, versions and updates; PostgreSQL in /data/pgdata), so a backup of /data covers everything.
#
# An entry with no value is a secret: set it in the app's Secrets (master: FAFNIRX_ADMIN_PASSWORD; db: POSTGRES_PASSWORD).
# ${{...}} points at another variable, so the database password is typed once.
x-hosting:
  expose: master
  port: 8080

services:
  master:
    image: jameelh99/fafnirx:latest
    ports:
      - "8080:8080" # web app and web API
    environment:
      FAFNIRX_DATABASE_URL: postgresql://fafnirx:${{db.POSTGRES_PASSWORD}}@${{db.HOST}}:${{db.PORT}}/fafnirx
      FAFNIRX_ADMIN_PASSWORD: # secret, read at the first start only
      FAFNIRX_DATA: /data
      HOME: /tmp # rclone wants a writable home for its cache
    volumes:
      - masterdata:/data
    depends_on:
      - db
  db:
    image: postgres:17
    expose:
      - "5432"
    environment:
      POSTGRES_DB: fafnirx
      POSTGRES_USER: fafnirx
      POSTGRES_PASSWORD: # secret
      PGDATA: /data/pgdata
    volumes:
      - pgdata:/data

volumes:
  masterdata:
  pgdata:

x-hosting:
  expose: web
  port: 8000

services:
  web:
    image: ghcr.io/jameelhamdan/docker-compose-example:latest
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_NAME: todos
      DB_USER: todos
      DB_PASSWORD: todos
      REDIS_HOST: redis
      DATA_DIR: /data
    volumes:
      - webdata:/data
    mem_limit: 256m
    depends_on:
      - db
      - redis
  db:
    image: postgres:16-alpine
    mem_limit: 512m
    environment:
      POSTGRES_DB: todos
      POSTGRES_USER: todos
      POSTGRES_PASSWORD: todos
      PGDATA: /data/pgdata
    volumes:
      - pgdata:/data
  redis:
    image: redis:7-alpine
    mem_limit: 128m
    volumes:
      - redisdata:/data

volumes:
  webdata:
  pgdata:
  redisdata:
